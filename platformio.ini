; World End SMS Network firmware
; Three build targets sharing the mesh/crypto/message/settings/serial-console
; core (src/network, src/crypto, src/message, src/storage, src/console):
;
;   esp32dev              -- ESP32 CYD (ESP32-2432S028R, resistive touch).
;                            Full touchscreen UI (LVGL) + status LED.
;   heltec_wifi_lora_32_v2 -- Heltec WiFi LoRa 32 (V2). No touch UI: the
;                            onboard SSD1306 OLED is read-only (shows
;                            incoming messages); sending/config is done
;                            entirely over the serial console.
;   ttgo_t_display         -- TTGO/LilyGo T-Display. No touch panel: the
;                            onboard ST7789 TFT is read-only (shows
;                            incoming messages); sending/config is done
;                            entirely over the serial console, same as
;                            the Heltec target.
;
; TFT_eSPI is configured entirely via build_flags (no User_Setup.h edits
; inside the library) -- this is the standard PlatformIO-friendly pattern.
; See: https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ArduinoJson, TaskScheduler and AsyncTCP are NOT listed explicitly --
; painlessMesh's own library.json already pins compatible versions of all
; three. Adding our own copies here previously caused a real conflict: two
; different AsyncTCP forks (ours + painlessMesh's) linked simultaneously and
; collided on every AsyncServer/AsyncClient symbol.
lib_deps =
    painlessmesh/painlessMesh@^1.5.0

build_flags =
    ; painlessMesh needs TaskScheduler built with std::function support (it
    ; schedules lambdas with captures, not plain function pointers).
    -D _TASK_STD_FUNCTION=1

[env:esp32dev]
board = esp32dev
extra_scripts = pre:extra_scripts/strip_lvgl_helium_asm.py
; Revisit (e.g. min_spiffs.csv or huge_app.csv) if LVGL fonts/emoji assets
; push the app image past the default app partition size.
board_build.partitions = default.csv

; Only this target's files -- excludes the Heltec and T-Display entry
; points and their read-only-display-only modules.
build_src_filter =
    +<*>
    -<main_heltec.cpp>
    -<main_ttgo.cpp>
    -<oled/>
    -<tft/>

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ${env.build_flags}
    ; This target has the discrete RGB LED -- gates rgb_led.h and the serial
    ; console's /led command, neither of which apply to heltec_wifi_lora_32_v2.
    -D HAS_RGB_LED=1
    ; --- TFT_eSPI: ILI9341 on HSPI, confirmed ESP32-2432S028R pinout ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; --- LVGL: config lives in include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; --- Touch (XPT2046), read in display/display_driver.cpp on its own SPI
    ;     bus (HSPI; TFT_eSPI defaults to VSPI on ESP32). NOTE: the CS pin is
    ;     named XPT_CS, not TOUCH_CS -- TFT_eSPI itself recognizes a macro
    ;     literally named TOUCH_CS and silently compiles in its own built-in
    ;     touch subsystem (Extensions/Touch.h) if that name is defined, which
    ;     collided with our separate XPT2046_Touchscreen driver owning the
    ;     same pin. ---
    -D TOUCH_CLK=25
    -D XPT_CS=33
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_IRQ=36

[env:heltec_wifi_lora_32_v2]
board = heltec_wifi_lora_32_V2

; Only this target's files -- excludes the CYD and T-Display entry points
; and the whole LVGL/TFT_eSPI/XPT2046/status-LED stack, none of which
; applies to this board (different pinout, no touch panel, no discrete
; RGB LED).
build_src_filter =
    +<*>
    -<main.cpp>
    -<main_ttgo.cpp>
    -<display/>
    -<ui/>
    -<led/>
    -<tft/>

lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:ttgo_t_display]
board = lilygo-t-display

; Only this target's files -- excludes the CYD and Heltec entry points and
; the whole LVGL/XPT2046/status-LED/OLED stacks, none of which applies to
; this board (different pinout, no touch panel, no discrete RGB LED, no
; SSD1306).
build_src_filter =
    +<*>
    -<main.cpp>
    -<main_heltec.cpp>
    -<display/>
    -<ui/>
    -<led/>
    -<oled/>

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ${env.build_flags}
    ; --- TFT_eSPI: ST7789 on the T-Display's dedicated SPI pins, per the
    ;     library's own bundled Setup25_TTGO_T_Display.h ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
